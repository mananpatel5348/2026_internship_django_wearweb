{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEAR WEB — Login</title>
  <link rel="stylesheet" href="{% static 'css/wear_web_login.css' %}">
</head>
<body>

  <div class="login-wrapper">

    <div class="page-brand">
      <span class="login-brand-title">Welcome Back</span>
      <span class="login-brand-name">Wear Web</span>
      <span class="login-brand-sub">Sign in to your account</span>
      <div class="login-divider">
        <span class="login-divider-icon">✦</span>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" value="Sign In">
    </form>

    <div class="signup-link">
      Don't have an account? <a href="{% url 'signup' %}">Create one</a>
    </div>

  </div>

</body>
</html>
